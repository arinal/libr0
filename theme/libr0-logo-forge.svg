<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- libr0 logo — "Forge v2".
       Philosophy: build the stdlib from scratch.
         Phase 1: blueprint scaffolding DRAWS ON one element at a time
                  (construction guides -> teeth -> rings -> bolts -> R),
                  rich CAD annotations.
         Phase 2: SOLIDIFIES inner -> outer (core/R -> ring -> outer gear).
       Modernized palette: warm orange gradient + slate, sky-blue blueprint.
       Same geometry as original (R is solid metal fused to ring; hollow center;
       12 teeth; 5 bolts). Pure SVG+CSS, plays once (~3.4s). -->
  <defs>
    <linearGradient id="g-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#E8430A"/>
    </linearGradient>
    <linearGradient id="g-slate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B3344"/>
      <stop offset="1" stop-color="#161C28"/>
    </linearGradient>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#38BDF8"/>
    </marker>
    <style>
      /* draw-on: each stroke element reveals via dashoffset 1 -> 0 */
      .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .45s ease forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      /* annotations fade in */
      .anno { opacity: 0; animation: afade .4s ease forwards; }
      @keyframes afade { to { opacity: 1; } }
      /* whole scaffold dissolves once metal forms */
      .scaffold-fade { animation: sfade .7s ease 2.6s forwards; }
      @keyframes sfade { from { opacity: 1; } to { opacity: 0; } }
      /* metal solidifies inner -> outer */
      .m-core  { opacity: 0; animation: mfade .45s ease 2.35s forwards; }
      .m-ring  { opacity: 0; animation: mfade .45s ease 2.70s forwards; }
      .m-outer { opacity: 0; animation: mfade .45s ease 3.05s forwards; }
      @keyframes mfade { to { opacity: 1; } }
    </style>
  </defs>

  <!-- ===================== SCAFFOLDING (undone) ===================== -->
  <g class="scaffold-fade">
    <!-- Construction guides: axes + diagonals (draw first, staggered) -->
    <g stroke="#38BDF8" stroke-width="0.6" opacity="0.7" fill="none">
      <line class="draw" pathLength="1" style="animation-delay:0s"     x1="100" y1="8"  x2="100" y2="192"/>
      <line class="draw" pathLength="1" style="animation-delay:.08s"  x1="8"   y1="100" x2="192" y2="100"/>
      <line class="draw" pathLength="1" style="animation-delay:.16s"  x1="36.4" y1="36.4" x2="163.6" y2="163.6"/>
      <line class="draw" pathLength="1" style="animation-delay:.24s"  x1="163.6" y1="36.4" x2="36.4" y2="163.6"/>
      <circle class="draw" pathLength="1" style="animation-delay:.32s" cx="100" cy="100" r="48"/>
      <circle class="draw" pathLength="1" style="animation-delay:.40s" cx="100" cy="100" r="60"/>
      <circle class="draw" pathLength="1" style="animation-delay:.48s" cx="100" cy="100" r="72"/>
      <circle class="draw" pathLength="1" style="animation-delay:.56s" cx="100" cy="100" r="80"/>
    </g>

    <!-- Center crosshair -->
    <g class="anno" style="animation-delay:.2s" stroke="#38BDF8" stroke-width="0.8">
      <line x1="94" y1="100" x2="106" y2="100"/>
      <line x1="100" y1="94" x2="100" y2="106"/>
    </g>

    <!-- Dashed gear teeth — draw ON ONE BY ONE -->
    <g fill="none" stroke="#FF8A3D" stroke-width="1.6" stroke-dasharray="4,2" opacity="0.85">
      <polygon class="draw" pathLength="1" style="animation-delay:.62s" points="93,5 107,5 111,22 89,22"/>
      <polygon class="draw" pathLength="1" style="animation-delay:.67s" points="93,5 107,5 111,22 89,22" transform="rotate(30 100 100)"/>
      <polygon class="draw" pathLength="1" style="animation-delay:.72s" points="93,5 107,5 111,22 89,22" transform="rotate(60 100 100)"/>
      <polygon class="draw" pathLength="1" style="animation-delay:.77s" points="93,5 107,5 111,22 89,22" transform="rotate(90 100 100)"/>
      <polygon class="draw" pathLength="1" style="animation-delay:.82s" points="93,5 107,5 111,22 89,22" transform="rotate(120 100 100)"/>
      <polygon class="draw" pathLength="1" style="animation-delay:.87s" points="93,5 107,5 111,22 89,22" transform="rotate(150 100 100)"/>
      <polygon class="draw" pathLength="1" style="animation-delay:.92s" points="93,5 107,5 111,22 89,22" transform="rotate(180 100 100)"/>
      <polygon class="draw" pathLength="1" style="animation-delay:.97s" points="93,5 107,5 111,22 89,22" transform="rotate(210 100 100)"/>
      <polygon class="draw" pathLength="1" style="animation-delay:1.02s" points="93,5 107,5 111,22 89,22" transform="rotate(240 100 100)"/>
      <polygon class="draw" pathLength="1" style="animation-delay:1.07s" points="93,5 107,5 111,22 89,22" transform="rotate(270 100 100)"/>
      <polygon class="draw" pathLength="1" style="animation-delay:1.12s" points="93,5 107,5 111,22 89,22" transform="rotate(300 100 100)"/>
      <polygon class="draw" pathLength="1" style="animation-delay:1.17s" points="93,5 107,5 111,22 89,22" transform="rotate(330 100 100)"/>
    </g>

    <!-- Dashed rings -->
    <circle class="draw" pathLength="1" style="animation-delay:1.25s" cx="100" cy="100" r="80" fill="none" stroke="#FF8A3D" stroke-width="2" stroke-dasharray="6,3" opacity="0.85"/>
    <circle class="draw" pathLength="1" style="animation-delay:1.35s" cx="100" cy="100" r="72" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6,3" opacity="0.85"/>
    <circle class="draw" pathLength="1" style="animation-delay:1.45s" cx="100" cy="100" r="48" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6,3" opacity="0.85"/>

    <!-- Dashed bolt holes -->
    <g fill="none" stroke="#38BDF8" stroke-width="1.4" stroke-dasharray="2,2" opacity="0.9">
      <circle class="draw" pathLength="1" style="animation-delay:1.55s" cx="100" cy="40" r="5"/>
      <circle class="draw" pathLength="1" style="animation-delay:1.60s" cx="157.1" cy="81.5" r="5"/>
      <circle class="draw" pathLength="1" style="animation-delay:1.65s" cx="135.3" cy="148.5" r="5"/>
      <circle class="draw" pathLength="1" style="animation-delay:1.70s" cx="64.7" cy="148.5" r="5"/>
      <circle class="draw" pathLength="1" style="animation-delay:1.75s" cx="42.9" cy="81.5" r="5"/>
    </g>

    <!-- Dashed R outline (draws last) -->
    <g fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4,2" opacity="0.95">
      <rect class="draw" pathLength="1" style="animation-delay:1.85s" x="56" y="62" width="22" height="10"/>
      <path class="draw" pathLength="1" style="animation-delay:1.95s" d="M 78 62 L 90 62 L 90 105 L 103 105 L 103 92 L 90 92 L 90 113 L 78 113 Z M 90 62 Q 125 62 125 82 Q 125 102 113 105 L 103 105 L 103 92 Q 115 92 115 82 Q 115 72 108 72 L 90 72 Z"/>
      <polygon class="draw" pathLength="1" style="animation-delay:2.10s" points="103,105 115,105 123,123 111,123"/>
      <rect class="draw" pathLength="1" style="animation-delay:2.18s" x="111" y="123" width="34" height="10"/>
      <rect class="draw" pathLength="1" style="animation-delay:2.26s" x="50" y="113" width="40" height="10"/>
    </g>

    <!-- ===== RICH CAD ANNOTATIONS ===== -->
    <g font-family="monospace" fill="#38BDF8">
      <!-- radius leaders -->
      <g class="anno" style="animation-delay:.7s" stroke="#38BDF8" stroke-width="0.5" opacity="0.85">
        <line x1="100" y1="100" x2="156" y2="56" marker-end="url(#arrow)"/>
        <text x="150" y="52" font-size="6" stroke="none">R80</text>
      </g>
      <g class="anno" style="animation-delay:.9s" stroke="#38BDF8" stroke-width="0.5" opacity="0.85">
        <line x1="100" y1="100" x2="170" y2="118" marker-end="url(#arrow)"/>
        <text x="148" y="118" font-size="6" stroke="none">R72</text>
      </g>
      <g class="anno" style="animation-delay:1.1s" stroke="#38BDF8" stroke-width="0.5" opacity="0.85">
        <line x1="100" y1="100" x2="66" y2="66" marker-end="url(#arrow)"/>
        <text x="60" y="78" font-size="6" stroke="none">R48</text>
      </g>
      <!-- angular pitch -->
      <text class="anno" style="animation-delay:1.0s" x="138" y="26" font-size="5.5" stroke="none">30°</text>
      <!-- bolt callout -->
      <g class="anno" style="animation-delay:1.7s" stroke="#38BDF8" stroke-width="0.5" opacity="0.85">
        <line x1="100" y1="40" x2="118" y2="22" marker-end="url(#arrow)"/>
        <text x="116" y="20" font-size="5.5" stroke="none">5x &#216;10</text>
      </g>
      <!-- diameter dim line across bottom -->
      <g class="anno" style="animation-delay:1.4s" stroke="#38BDF8" stroke-width="0.5" opacity="0.8">
        <line x1="24" y1="178" x2="176" y2="178" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
        <line x1="24" y1="174" x2="24" y2="182"/>
        <line x1="176" y1="174" x2="176" y2="182"/>
        <rect x="88" y="172" width="24" height="9" fill="#0E1320" stroke="none"/>
        <text x="90" y="179" font-size="5.5" stroke="none" fill="#38BDF8">&#216;160</text>
      </g>
      <!-- spec labels -->
      <text class="anno" style="animation-delay:.5s" x="10" y="14" font-size="5" stroke="none" opacity="0.8">libr0 // GEAR-R</text>
      <text class="anno" style="animation-delay:.6s" x="10" y="21" font-size="4.5" stroke="none" opacity="0.7">12T  M1:1</text>
      <text class="anno" style="animation-delay:2.0s" x="142" y="158" font-size="4.5" stroke="none" opacity="0.7">REV.0</text>
    </g>
  </g>

  <!-- ===================== SOLID METAL (done) ===================== -->
  <!-- doc order back->front: outer, ring, core; time order core->ring->outer -->
  <g class="m-outer">
    <circle cx="100" cy="100" r="80" fill="url(#g-orange)"/>
    <g fill="url(#g-orange)">
      <polygon points="93,5 107,5 111,22 89,22"/>
      <polygon points="93,5 107,5 111,22 89,22" transform="rotate(30 100 100)"/>
      <polygon points="93,5 107,5 111,22 89,22" transform="rotate(60 100 100)"/>
      <polygon points="93,5 107,5 111,22 89,22" transform="rotate(90 100 100)"/>
      <polygon points="93,5 107,5 111,22 89,22" transform="rotate(120 100 100)"/>
      <polygon points="93,5 107,5 111,22 89,22" transform="rotate(150 100 100)"/>
      <polygon points="93,5 107,5 111,22 89,22" transform="rotate(180 100 100)"/>
      <polygon points="93,5 107,5 111,22 89,22" transform="rotate(210 100 100)"/>
      <polygon points="93,5 107,5 111,22 89,22" transform="rotate(240 100 100)"/>
      <polygon points="93,5 107,5 111,22 89,22" transform="rotate(270 100 100)"/>
      <polygon points="93,5 107,5 111,22 89,22" transform="rotate(300 100 100)"/>
      <polygon points="93,5 107,5 111,22 89,22" transform="rotate(330 100 100)"/>
    </g>
  </g>

  <g class="m-ring">
    <circle cx="100" cy="100" r="72" fill="url(#g-slate)"/>
  </g>

  <g class="m-core">
    <circle cx="100" cy="100" r="48" fill="#FFFFFF"/>
    <!-- bolts sit on ring band; drawn with core so they read against slate -->
    <g fill="#FFFFFF">
      <circle cx="100" cy="40" r="5"/>
      <circle cx="157.1" cy="81.5" r="5"/>
      <circle cx="135.3" cy="148.5" r="5"/>
      <circle cx="64.7" cy="148.5" r="5"/>
      <circle cx="42.9" cy="81.5" r="5"/>
    </g>
    <g fill="#1E2530">
      <rect x="56" y="62" width="22" height="10"/>
      <path d="M 78 62 L 90 62 L 90 105 L 103 105 L 103 92 L 90 92 L 90 113 L 78 113 Z M 90 62 Q 125 62 125 82 Q 125 102 113 105 L 103 105 L 103 92 Q 115 92 115 82 Q 115 72 108 72 L 90 72 Z"/>
      <polygon points="103,105 115,105 123,123 111,123"/>
      <rect x="111" y="123" width="34" height="10"/>
      <rect x="50" y="113" width="40" height="10"/>
    </g>
  </g>
</svg>
