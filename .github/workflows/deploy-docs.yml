name: Deploy Documentation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache cargo binaries
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-cargo-bins-mdbook-0.5.2-svgbob-0.5.1-mermaid-0.17.0

      - name: Install mdBook
        run: cargo install mdbook --version 0.5.2

      - name: Install mdbook-svgbob
        run: cargo install mdbook-svgbob --git https://github.com/arinal/mdbook-svgbob --branch mdbook-0.5

      - name: Install mdbook-mermaid
        run: cargo install mdbook-mermaid --version 0.17.0

      - name: Setup mermaid
        run: mdbook-mermaid install

      - name: Build documentation
        run: ./build.sh

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book
          keep_files: false
          force_orphan: false