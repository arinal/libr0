name: Deploy Documentation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache cargo binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/mdbook
            ~/.cargo/bin/mdbook-svgbob
            ~/.cargo/bin/mdbook-mermaid
          key: ${{ runner.os }}-cargo-bins-mdbook-0.5.2-svgbob-0.5-mermaid-0.17.0
          restore-keys: |
            ${{ runner.os }}-cargo-bins-

      - name: Install mdBook
        run: |
          if ! command -v mdbook &> /dev/null || [ "$(mdbook --version | grep -o '0\.5\.2')" != "0.5.2" ]; then
            cargo install mdbook --version 0.5.2 --force
          else
            echo "mdBook 0.5.2 already installed"
          fi

      - name: Install mdbook-svgbob
        run: |
          if ! command -v mdbook-svgbob &> /dev/null; then
            cargo install mdbook-svgbob --git https://github.com/arinal/mdbook-svgbob --branch mdbook-0.5
          else
            echo "mdbook-svgbob already installed"
          fi

      - name: Install mdbook-mermaid
        run: |
          if ! command -v mdbook-mermaid &> /dev/null; then
            cargo install mdbook-mermaid --version 0.17.0
          else
            echo "mdbook-mermaid already installed"
          fi

      - name: Setup mermaid
        run: mdbook-mermaid install

      - name: Build documentation
        run: ./build.sh

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book
          keep_files: false
          force_orphan: false