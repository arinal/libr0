<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer gear ring forming the "0" -->
  <circle cx="60" cy="60" r="45" fill="none" stroke="#CE422B" stroke-width="8"/>

  <!-- Inner gear ring -->
  <circle cx="60" cy="60" r="30" fill="none" stroke="#CE422B" stroke-width="6"/>

  <!-- Gear teeth around outer circle -->
  <g stroke="#CE422B" stroke-width="3" stroke-linecap="round">
    <!-- Top -->
    <line x1="60" y1="10" x2="60" y2="20"/>
    <!-- Top-right -->
    <line x1="91.2" y1="21.2" x2="85" y2="27.4"/>
    <!-- Right -->
    <line x1="110" y1="60" x2="100" y2="60"/>
    <!-- Bottom-right -->
    <line x1="91.2" y1="98.8" x2="85" y2="92.6"/>
    <!-- Bottom -->
    <line x1="60" y1="110" x2="60" y2="100"/>
    <!-- Bottom-left -->
    <line x1="28.8" y1="98.8" x2="35" y2="92.6"/>
    <!-- Left -->
    <line x1="10" y1="60" x2="20" y2="60"/>
    <!-- Top-left -->
    <line x1="28.8" y1="21.2" x2="35" y2="27.4"/>
  </g>

  <!-- Inner gear teeth -->
  <g stroke="#CE422B" stroke-width="2" stroke-linecap="round">
    <!-- 45 degree angles -->
    <line x1="71.2" y1="38.8" x2="75" y2="35"/>
    <line x1="81.2" y1="48.8" x2="85" y2="45"/>
    <line x1="81.2" y1="71.2" x2="85" y2="75"/>
    <line x1="71.2" y1="81.2" x2="75" y2="85"/>
    <line x1="48.8" y1="81.2" x2="45" y2="85"/>
    <line x1="38.8" y1="71.2" x2="35" y2="75"/>
    <line x1="38.8" y1="48.8" x2="35" y2="45"/>
    <line x1="48.8" y1="38.8" x2="45" y2="35"/>
  </g>

  <!-- Center dot representing "from zero" -->
  <circle cx="60" cy="60" r="8" fill="#CE422B"/>

  <!-- Subtle connecting lines to show building/construction -->
  <g stroke="#CE422B" stroke-width="1.5" opacity="0.4" stroke-dasharray="2,2">
    <line x1="60" y1="38" x2="60" y2="52"/>
    <line x1="60" y1="68" x2="60" y2="82"/>
    <line x1="38" y1="60" x2="52" y2="60"/>
    <line x1="68" y1="60" x2="82" y2="60"/>
  </g>
</svg>